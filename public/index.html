<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TaskFlow — Project & Task Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0e0f11;
  --bg2: #161719;
  --bg3: #1e2023;
  --bg4: #26282d;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #f0f0f2;
  --text2: #9b9da6;
  --text3: #5c5f6b;
  --accent: #6c63ff;
  --accent-dim: rgba(108,99,255,0.15);
  --accent2: #00d4aa;
  --accent2-dim: rgba(0,212,170,0.12);
  --danger: #ff4f6b;
  --danger-dim: rgba(255,79,107,0.12);
  --warn: #f59e0b;
  --warn-dim: rgba(245,158,11,0.12);
  --success: #22d3a5;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea,select{font-family:inherit;outline:none}

/* ── AUTH SCREENS ── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:radial-gradient(ellipse at 60% 20%,rgba(108,99,255,0.08) 0%,transparent 60%)}
.auth-card{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:2.5rem;width:100%;max-width:420px}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:2rem}
.logo-mark{width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:#fff;flex-shrink:0}
.auth-logo span{font-size:20px;font-weight:600;letter-spacing:-0.3px}
.auth-card h1{font-size:22px;font-weight:600;margin-bottom:.4rem;letter-spacing:-0.4px}
.auth-card p{color:var(--text2);font-size:14px;margin-bottom:1.8rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:.4rem}
.field input,.field select{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:.7rem .9rem;color:var(--text);font-size:14px;transition:border-color .15s}
.field input:focus,.field select:focus{border-color:var(--accent)}
.field select option{background:var(--bg3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:.7rem 1.2rem;border-radius:var(--radius-sm);font-size:14px;font-weight:500;transition:all .15s;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{filter:brightness(1.1)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}.btn-secondary:hover{background:var(--bg4)}
.btn-danger{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(255,79,107,0.2)}.btn-danger:hover{background:rgba(255,79,107,0.2)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{color:var(--text);border-color:var(--border2)}
.btn-sm{padding:.45rem .85rem;font-size:13px}
.btn-full{width:100%}
.auth-switch{text-align:center;margin-top:1.5rem;font-size:13px;color:var(--text2)}
.auth-switch button{background:none;border:none;color:var(--accent);font-size:13px;font-family:inherit;cursor:pointer;font-weight:500}
.error-msg{background:var(--danger-dim);border:1px solid rgba(255,79,107,0.2);color:var(--danger);padding:.6rem .9rem;border-radius:var(--radius-sm);font-size:13px;margin-bottom:1rem}

/* ── LAYOUT ── */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-logo{display:flex;align-items:center;gap:9px;padding:1.4rem 1.2rem 1rem;border-bottom:1px solid var(--border)}
.sidebar-logo span{font-size:17px;font-weight:600;letter-spacing:-0.3px}
.sidebar-section{padding:.6rem .7rem}
.sidebar-label{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;padding:.5rem .6rem;margin-bottom:.2rem}
.nav-item{display:flex;align-items:center;gap:9px;padding:.6rem .7rem;border-radius:var(--radius-sm);color:var(--text2);font-size:14px;cursor:pointer;transition:all .12s;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent)}
.nav-item .icon{font-size:16px;width:18px;text-align:center;flex-shrink:0}
.sidebar-user{margin-top:auto;padding:1rem 1.2rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;color:var(--text3)}
.logout-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:3px;transition:color .12s}.logout-btn:hover{color:var(--danger)}
.main{flex:1;overflow-y:auto;min-width:0}
.page{padding:2rem 2.5rem;max-width:1100px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;gap:1rem}
.page-title{font-size:22px;font-weight:600;letter-spacing:-0.4px}
.page-sub{font-size:14px;color:var(--text2);margin-top:2px}

/* ── CARDS & GRID ── */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem}
.stat-num{font-size:32px;font-weight:600;letter-spacing:-1px;line-height:1}
.stat-label{font-size:13px;color:var(--text2);margin-top:.35rem}
.stat-icon{font-size:20px;margin-bottom:.5rem}

/* ── PROJECT CARDS ── */
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin-top:1.5rem}
.project-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.3rem;cursor:pointer;transition:all .15s;position:relative}
.project-card:hover{border-color:var(--border2);background:var(--bg3);transform:translateY(-1px)}
.project-card-name{font-size:15px;font-weight:600;margin-bottom:.4rem;letter-spacing:-0.2px}
.project-card-desc{font-size:13px;color:var(--text2);margin-bottom:1rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.project-card-meta{display:flex;align-items:center;gap:.7rem;font-size:12px;color:var(--text3)}
.project-status{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:100px}
.status-active{background:var(--accent2-dim);color:var(--accent2)}
.status-archived{background:var(--bg4);color:var(--text3)}

/* ── TASK TABLE ── */
.task-filters{display:flex;align-items:center;gap:.7rem;margin-bottom:1.2rem;flex-wrap:wrap}
.filter-select{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:.45rem .7rem;color:var(--text);font-size:13px}
.task-table{width:100%;border-collapse:collapse}
.task-table th{text-align:left;font-size:12px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;padding:.7rem .9rem;border-bottom:1px solid var(--border);white-space:nowrap}
.task-table td{padding:.85rem .9rem;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
.task-table tr:last-child td{border-bottom:none}
.task-table tr:hover td{background:var(--bg3)}
.task-title-cell{font-weight:500;max-width:260px}
.task-title-cell small{display:block;color:var(--text2);font-size:12px;font-weight:400;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:100px;white-space:nowrap}
.badge-todo{background:var(--bg4);color:var(--text2)}
.badge-in_progress{background:rgba(108,99,255,0.15);color:#9d96ff}
.badge-done{background:var(--accent2-dim);color:var(--accent2)}
.badge-low{background:var(--bg4);color:var(--text3)}
.badge-medium{background:var(--warn-dim);color:var(--warn)}
.badge-high{background:var(--danger-dim);color:var(--danger)}
.badge-overdue{background:var(--danger-dim);color:var(--danger)}
.assignee-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}
.assignee-chip .mini-avatar{width:18px;height:18px;border-radius:4px;background:var(--accent);font-size:9px;font-weight:600;color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem;backdrop-filter:blur(2px)}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.4rem 1rem;border-bottom:1px solid var(--border)}
.modal-title{font-size:16px;font-weight:600;letter-spacing:-0.2px}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;line-height:1;padding:2px}.modal-close:hover{color:var(--text)}
.modal-body{padding:1.3rem 1.4rem}
.modal-footer{display:flex;justify-content:flex-end;gap:.7rem;padding:.9rem 1.4rem 1.2rem}
.field textarea{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:.7rem .9rem;color:var(--text);font-size:14px;resize:vertical;min-height:80px;transition:border-color .15s}
.field textarea:focus{border-color:var(--accent)}

/* ── DASHBOARD ── */
.dash-section{margin-bottom:2rem}
.dash-section-title{font-size:14px;font-weight:500;color:var(--text2);margin-bottom:.8rem}
.mini-task-row{display:flex;align-items:center;gap:.8rem;padding:.65rem .8rem;border-radius:var(--radius-sm);font-size:13px;border-bottom:1px solid var(--border)}
.mini-task-row:last-child{border-bottom:none}
.mini-task-row:hover{background:var(--bg3)}
.mini-task-title{flex:1;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-task-project{font-size:12px;color:var(--text3);white-space:nowrap}
.overdue-tag{font-size:11px;background:var(--danger-dim);color:var(--danger);padding:2px 7px;border-radius:100px;white-space:nowrap}

/* ── MEMBERS ── */
.member-row{display:flex;align-items:center;gap:.9rem;padding:.7rem 0;border-bottom:1px solid var(--border)}
.member-row:last-child{border-bottom:none}
.member-info{flex:1}
.member-name{font-size:14px;font-weight:500}
.member-email{font-size:12px;color:var(--text3)}
.role-badge{font-size:11px;padding:2px 8px;border-radius:100px;font-weight:500}
.role-admin{background:var(--accent-dim);color:var(--accent)}
.role-member{background:var(--bg4);color:var(--text2)}

/* ── EMPTY & LOADING ── */
.empty{text-align:center;padding:3rem 1rem;color:var(--text3)}
.empty-icon{font-size:36px;margin-bottom:.8rem}
.empty p{font-size:14px}
.loading{display:flex;align-items:center;justify-content:center;padding:3rem;color:var(--text3);font-size:14px;gap:.6rem}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── BREADCRUMB ── */
.breadcrumb{display:flex;align-items:center;gap:.4rem;font-size:13px;color:var(--text3);margin-bottom:1.5rem}
.breadcrumb-link{cursor:pointer;color:var(--text2)}.breadcrumb-link:hover{color:var(--accent)}
.breadcrumb-sep{color:var(--text3)}

/* ── TABS ── */
.tabs{display:flex;gap:2px;background:var(--bg3);border-radius:var(--radius-sm);padding:3px;margin-bottom:1.5rem;width:fit-content}
.tab{padding:.45rem 1rem;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);transition:all .12s;border:none;background:none}
.tab.active{background:var(--bg2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.3)}

/* ── NOTIFICATIONS ── */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:.8rem 1.1rem;font-size:13px;max-width:300px;box-shadow:var(--shadow);z-index:999;animation:slideIn .2s ease}
@keyframes slideIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast.success{border-color:rgba(0,212,170,0.3);color:var(--accent2)}
.toast.error{border-color:rgba(255,79,107,0.3);color:var(--danger)}

/* ── RESPONSIVE ── */
@media(max-width:700px){
  .sidebar{width:200px}
  .page{padding:1.2rem 1rem}
  .grid-4{grid-template-columns:1fr 1fr}
  .grid-3{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="root"></div>

<script>
// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
const API = '/api';
let state = {
  view: 'login',       // login | signup | dashboard | projects | project | tasks | members | users
  token: localStorage.getItem('tf_token') || null,
  user: JSON.parse(localStorage.getItem('tf_user') || 'null'),
  projects: [],
  currentProject: null,
  tasks: [],
  dashData: null,
  allUsers: [],
  modal: null,         // null | { type, data }
  loading: false,
  error: null,
  taskFilter: { status: '', priority: '', assignee_id: '' }
};

// ═══════════════════════════════════════════════════════════
//  API HELPERS
// ═══════════════════════════════════════════════════════════
async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' }
  };
  if (state.token) opts.headers['Authorization'] = 'Bearer ' + state.token;
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || data.errors?.[0]?.msg || 'Error');
  return data;
}

function setToken(token, user) {
  state.token = token;
  state.user = user;
  localStorage.setItem('tf_token', token);
  localStorage.setItem('tf_user', JSON.stringify(user));
}

function logout() {
  state.token = null; state.user = null;
  localStorage.removeItem('tf_token');
  localStorage.removeItem('tf_user');
  state.view = 'login';
  render();
}

// ═══════════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════════
function toast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ═══════════════════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════════════════
async function navigate(view, params = {}) {
  state.view = view;
  state.error = null;
  state.modal = null;
  state.loading = true;
  render();

  try {
    if (view === 'dashboard') {
      state.dashData = await api('GET', '/dashboard');
    }
    if (view === 'projects') {
      state.projects = await api('GET', '/projects');
    }
    if (view === 'project' && params.id) {
      state.currentProject = await api('GET', `/projects/${params.id}`);
      state.tasks = await api('GET', `/projects/${params.id}/tasks`);
      state.allUsers = await api('GET', '/auth/users');
    }
    if (view === 'members' && params.id) {
      state.currentProject = await api('GET', `/projects/${params.id}`);
      state.allUsers = await api('GET', '/auth/users');
    }
  } catch(e) {
    state.error = e.message;
  }
  state.loading = false;
  render();
}

// ═══════════════════════════════════════════════════════════
//  RENDER ENGINE
// ═══════════════════════════════════════════════════════════
function render() {
  const root = document.getElementById('root');
  if (!state.token) {
    root.innerHTML = state.view === 'signup' ? renderSignup() : renderLogin();
    attachAuthHandlers();
  } else {
    root.innerHTML = `<div class="app">${renderSidebar()}${renderMain()}</div>`;
    attachAppHandlers();
  }
  if (state.modal) {
    document.body.insertAdjacentHTML('beforeend', renderModal());
    attachModalHandlers();
  }
}

// ═══════════════════════════════════════════════════════════
//  AUTH VIEWS
// ═══════════════════════════════════════════════════════════
function renderLogin() {
  return `<div class="auth-wrap"><div class="auth-card">
    <div class="auth-logo"><div class="logo-mark">T</div><span>TaskFlow</span></div>
    <h1>Welcome back</h1>
    <p>Sign in to your workspace</p>
    ${state.error ? `<div class="error-msg">${state.error}</div>` : ''}
    <form id="loginForm">
      <div class="field"><label>Email</label><input type="email" name="email" placeholder="you@example.com" required/></div>
      <div class="field"><label>Password</label><input type="password" name="password" placeholder="••••••••" required/></div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:.5rem">Sign in</button>
    </form>
    <div class="auth-switch">No account? <button id="goSignup">Create one</button></div>
    <div style="margin-top:1.2rem;padding:1rem;background:var(--bg3);border-radius:8px;font-size:12px;color:var(--text3)">
      <strong style="color:var(--text2)">Demo:</strong> Sign up to get started. Choose Admin role for full access.
    </div>
  </div></div>`;
}

function renderSignup() {
  return `<div class="auth-wrap"><div class="auth-card">
    <div class="auth-logo"><div class="logo-mark">T</div><span>TaskFlow</span></div>
    <h1>Create account</h1>
    <p>Join your team's workspace</p>
    ${state.error ? `<div class="error-msg">${state.error}</div>` : ''}
    <form id="signupForm">
      <div class="field"><label>Name</label><input type="text" name="name" placeholder="Your name" required/></div>
      <div class="field"><label>Email</label><input type="email" name="email" placeholder="you@example.com" required/></div>
      <div class="field"><label>Password</label><input type="password" name="password" placeholder="Min 6 chars" required/></div>
      <div class="field"><label>Role</label>
        <select name="role">
          <option value="member">Member</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:.5rem">Create account</button>
    </form>
    <div class="auth-switch">Have an account? <button id="goLogin">Sign in</button></div>
  </div></div>`;
}

// ═══════════════════════════════════════════════════════════
//  SIDEBAR
// ═══════════════════════════════════════════════════════════
function renderSidebar() {
  const u = state.user;
  const initials = u?.name?.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase() || '?';
  const isAdmin = u?.role === 'admin';

  return `<div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">T</div>
      <span>TaskFlow</span>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Menu</div>
      <div class="nav-item ${state.view==='dashboard'?'active':''}" data-nav="dashboard">
        <span class="icon">⊞</span> Dashboard
      </div>
      <div class="nav-item ${state.view==='projects'||state.view==='project'?'active':''}" data-nav="projects">
        <span class="icon">◫</span> Projects
      </div>
      ${isAdmin ? `<div class="nav-item" data-nav="users"><span class="icon">👥</span> Users</div>` : ''}
    </div>
    <div class="sidebar-user">
      <div class="avatar">${initials}</div>
      <div class="user-info">
        <div class="user-name">${u?.name || ''}</div>
        <div class="user-role">${u?.role || ''}</div>
      </div>
      <button class="logout-btn" id="logoutBtn" title="Logout">⏻</button>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════
//  MAIN CONTENT ROUTER
// ═══════════════════════════════════════════════════════════
function renderMain() {
  if (state.loading) return `<div class="main"><div class="loading"><div class="spinner"></div> Loading…</div></div>`;
  if (state.error && !['project','tasks'].includes(state.view))
    return `<div class="main"><div class="page"><div class="error-msg">${state.error}</div></div></div>`;

  let content = '';
  switch(state.view) {
    case 'dashboard': content = renderDashboard(); break;
    case 'projects': content = renderProjects(); break;
    case 'project': content = renderProjectDetail(); break;
    case 'members': content = renderMembers(); break;
    case 'users': content = renderUsers(); break;
    default: content = renderDashboard();
  }
  return `<div class="main"><div class="page">${content}</div></div>`;
}

// ═══════════════════════════════════════════════════════════
//  PROJECT DETAIL (tasks view)
// ═══════════════════════════════════════════════════════════
function renderProjectDetail() {
  const p = state.currentProject;
  if (!p) return '';
  const isProjectAdmin = state.user?.role === 'admin' || p.owner_id === state.user?.id ||
    p.members?.find(m => m.id === state.user?.id)?.project_role === 'admin';

  const f = state.taskFilter;
  const tasks = state.tasks.filter(t =>
    (!f.status || t.status === f.status) &&
    (!f.priority || t.priority === f.priority) &&
    (!f.assignee_id || String(t.assignee_id) === String(f.assignee_id))
  );

  return `
    <div class="breadcrumb">
      <span class="breadcrumb-link" data-nav="projects">Projects</span>
      <span class="breadcrumb-sep">/</span>
      <span>${esc(p.name)}</span>
    </div>
    <div class="page-header">
      <div>
        <div class="page-title">${esc(p.name)}</div>
        <div class="page-sub">${esc(p.description||'')} &nbsp;·&nbsp; <span class="project-status ${p.status==='active'?'status-active':'status-archived'}">${p.status}</span></div>
      </div>
      <div style="display:flex;gap:.6rem">
        ${isProjectAdmin ? `<button class="btn btn-ghost btn-sm" data-nav-members="${p.id}">👥 Members</button>` : ''}
        ${isProjectAdmin ? `<button class="btn btn-primary btn-sm" id="newTaskBtn">+ Task</button>` : ''}
      </div>
    </div>

    <div class="task-filters">
      <select class="filter-select" id="filterStatus">
        <option value="">All statuses</option>
        <option value="todo" ${f.status==='todo'?'selected':''}>To Do</option>
        <option value="in_progress" ${f.status==='in_progress'?'selected':''}>In Progress</option>
        <option value="done" ${f.status==='done'?'selected':''}>Done</option>
      </select>
      <select class="filter-select" id="filterPriority">
        <option value="">All priorities</option>
        <option value="high" ${f.priority==='high'?'selected':''}>High</option>
        <option value="medium" ${f.priority==='medium'?'selected':''}>Medium</option>
        <option value="low" ${f.priority==='low'?'selected':''}>Low</option>
      </select>
      <select class="filter-select" id="filterAssignee">
        <option value="">All assignees</option>
        ${(p.members||[]).map(m => `<option value="${m.id}" ${f.assignee_id==m.id?'selected':''}>${esc(m.name)}</option>`).join('')}
      </select>
      <span style="font-size:13px;color:var(--text3);margin-left:auto">${tasks.length} task${tasks.length!==1?'s':''}</span>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      ${!tasks.length ? `<div class="empty"><div class="empty-icon">☐</div><p>No tasks found</p></div>` : `
      <table class="task-table">
        <thead>
          <tr>
            <th>Task</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Assignee</th>
            <th>Due</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${tasks.map(task => {
            const isOverdue = task.due_date && new Date(task.due_date) < new Date() && task.status !== 'done';
            const canEdit = isProjectAdmin || task.assignee_id === state.user?.id || task.created_by === state.user?.id;
            return `<tr>
              <td class="task-title-cell">
                ${esc(task.title)}
                ${task.description ? `<small>${esc(task.description.slice(0,60))}${task.description.length>60?'…':''}</small>` : ''}
              </td>
              <td><span class="badge badge-${task.status}">${fmtStatus(task.status)}</span></td>
              <td><span class="badge badge-${task.priority}">${task.priority}</span></td>
              <td>${task.assignee_name ? `<span class="assignee-chip"><span class="mini-avatar">${task.assignee_name.split(' ').map(w=>w[0]).join('').slice(0,2)}</span>${esc(task.assignee_name)}</span>` : '<span style="color:var(--text3);font-size:12px">Unassigned</span>'}</td>
              <td><span ${isOverdue?'class="badge badge-overdue"':'style="font-size:13px;color:var(--text2)"'}>${task.due_date||'—'}</span></td>
              <td>
                ${canEdit ? `<button class="btn btn-ghost btn-sm" data-edit-task="${task.id}">Edit</button>` : ''}
                ${isProjectAdmin ? `<button class="btn btn-danger btn-sm" style="margin-left:4px" data-del-task="${task.id}">Del</button>` : ''}
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
    </div>`;
}

// ═══════════════════════════════════════════════════════════
//  MODALS
// ═══════════════════════════════════════════════════════════
function renderModal() {
  const { type, data } = state.modal;
  let content = '';

  if (type === 'newProject') {
    content = `
      <div class="modal-header"><span class="modal-title">New project</span><button class="modal-close" id="closeModal">×</button></div>
      <div class="modal-body">
        <div class="field"><label>Name *</label><input id="mProjName" placeholder="Project name" required/></div>
        <div class="field"><label>Description</label><textarea id="mProjDesc" placeholder="What's this project about?"></textarea></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="closeModal">Cancel</button>
        <button class="btn btn-primary" id="submitProject">Create project</button>
      </div>`;
  }

  if (type === 'newTask' || type === 'editTask') {
    const task = data || {};
    const members = state.currentProject?.members || [];
    content = `
      <div class="modal-header"><span class="modal-title">${type==='newTask'?'New task':'Edit task'}</span><button class="modal-close" id="closeModal">×</button></div>
      <div class="modal-body">
        <div class="field"><label>Title *</label><input id="mTaskTitle" value="${esc(task.title||'')}" placeholder="Task title"/></div>
        <div class="field"><label>Description</label><textarea id="mTaskDesc" placeholder="Optional details…">${esc(task.description||'')}</textarea></div>
        <div class="grid-2" style="gap:.8rem">
          <div class="field"><label>Status</label>
            <select id="mTaskStatus">
              <option value="todo" ${task.status==='todo'?'selected':''}>To Do</option>
              <option value="in_progress" ${task.status==='in_progress'?'selected':''}>In Progress</option>
              <option value="done" ${task.status==='done'?'selected':''}>Done</option>
            </select>
          </div>
          <div class="field"><label>Priority</label>
            <select id="mTaskPriority">
              <option value="low" ${task.priority==='low'?'selected':''}>Low</option>
              <option value="medium" ${(!task.priority||task.priority==='medium')?'selected':''}>Medium</option>
              <option value="high" ${task.priority==='high'?'selected':''}>High</option>
            </select>
          </div>
        </div>
        <div class="grid-2" style="gap:.8rem">
          <div class="field"><label>Assignee</label>
            <select id="mTaskAssignee">
              <option value="">Unassigned</option>
              ${members.map(m => `<option value="${m.id}" ${task.assignee_id==m.id?'selected':''}>${esc(m.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Due date</label>
            <input type="date" id="mTaskDue" value="${task.due_date||''}"/>
          </div>
        </div>
        ${state.error ? `<div class="error-msg">${state.error}</div>` : ''}
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="closeModal">Cancel</button>
        <button class="btn btn-primary" id="submitTask" data-task-id="${task.id||''}">${type==='newTask'?'Create task':'Save changes'}</button>
      </div>`;
  }

  if (type === 'addMember') {
    const projectMembers = state.currentProject?.members?.map(m => m.id) || [];
    const available = state.allUsers.filter(u => !projectMembers.includes(u.id));
    content = `
      <div class="modal-header"><span class="modal-title">Add member</span><button class="modal-close" id="closeModal">×</button></div>
      <div class="modal-body">
        <div class="field"><label>User</label>
          <select id="mMemberUser">
            <option value="">Select user…</option>
            ${available.map(u => `<option value="${u.id}">${esc(u.name)} (${esc(u.email)})</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Project role</label>
          <select id="mMemberRole">
            <option value="member">Member</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        ${state.error ? `<div class="error-msg">${state.error}</div>` : ''}
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="closeModal">Cancel</button>
        <button class="btn btn-primary" id="submitMember">Add member</button>
      </div>`;
  }

  return `<div class="modal-overlay" id="modalOverlay"><div class="modal">${content}</div></div>`;
}

// ═══════════════════════════════════════════════════════════
//  EVENT HANDLERS
// ═══════════════════════════════════════════════════════════
function attachAuthHandlers() {
  document.getElementById('loginForm')?.addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      const res = await api('POST', '/auth/login', { email: fd.get('email'), password: fd.get('password') });
      setToken(res.token, res.user);
      state.error = null;
      await navigate('dashboard');
    } catch(err) {
      state.error = err.message;
      render();
    }
  });

  document.getElementById('signupForm')?.addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      const res = await api('POST', '/auth/signup', {
        name: fd.get('name'), email: fd.get('email'),
        password: fd.get('password'), role: fd.get('role')
      });
      setToken(res.token, res.user);
      state.error = null;
      await navigate('dashboard');
    } catch(err) {
      state.error = err.message;
      render();
    }
  });

  document.getElementById('goSignup')?.addEventListener('click', () => { state.view='signup'; state.error=null; render(); });
  document.getElementById('goLogin')?.addEventListener('click', () => { state.view='login'; state.error=null; render(); });
}

function attachAppHandlers() {
  // Sidebar nav
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => navigate(el.dataset.nav));
  });
  document.getElementById('logoutBtn')?.addEventListener('click', logout);

  // Project cards
  document.querySelectorAll('[data-project-id]').forEach(el => {
    el.addEventListener('click', () => navigate('project', { id: el.dataset.projectId }));
  });

  // Breadcrumb nav
  document.querySelectorAll('[data-nav-project]').forEach(el => {
    el.addEventListener('click', () => navigate('project', { id: el.dataset.navProject }));
  });
  document.querySelectorAll('[data-nav-members]').forEach(el => {
    el.addEventListener('click', () => navigate('members', { id: el.dataset.navMembers }));
  });

  // New project button
  document.getElementById('newProjectBtn')?.addEventListener('click', () => {
    state.modal = { type: 'newProject' };
    render();
  });

  // New task button
  document.getElementById('newTaskBtn')?.addEventListener('click', () => {
    state.modal = { type: 'newTask' };
    render();
  });

  // Edit task
  document.querySelectorAll('[data-edit-task]').forEach(el => {
    el.addEventListener('click', () => {
      const task = state.tasks.find(t => t.id == el.dataset.editTask);
      state.modal = { type: 'editTask', data: task };
      render();
    });
  });

  // Delete task
  document.querySelectorAll('[data-del-task]').forEach(el => {
    el.addEventListener('click', async () => {
      if (!confirm('Delete this task?')) return;
      try {
        await api('DELETE', `/projects/${state.currentProject.id}/tasks/${el.dataset.delTask}`);
        state.tasks = state.tasks.filter(t => t.id != el.dataset.delTask);
        toast('Task deleted');
        render();
      } catch(e) { toast(e.message, 'error'); }
    });
  });

  // Remove member
  document.querySelectorAll('[data-remove-member]').forEach(el => {
    el.addEventListener('click', async () => {
      if (!confirm('Remove this member?')) return;
      try {
        await api('DELETE', `/projects/${state.currentProject.id}/members/${el.dataset.removeMember}`);
        toast('Member removed');
        navigate('members', { id: state.currentProject.id });
      } catch(e) { toast(e.message, 'error'); }
    });
  });

  // Add member button
  document.getElementById('addMemberBtn')?.addEventListener('click', () => {
    state.modal = { type: 'addMember' };
    render();
  });

  // Task filters
  document.getElementById('filterStatus')?.addEventListener('change', e => {
    state.taskFilter.status = e.target.value; render();
  });
  document.getElementById('filterPriority')?.addEventListener('change', e => {
    state.taskFilter.priority = e.target.value; render();
  });
  document.getElementById('filterAssignee')?.addEventListener('change', e => {
    state.taskFilter.assignee_id = e.target.value; render();
  });

  // Users page
  if (state.view === 'users' && state.user?.role === 'admin' && !state.allUsers.length) {
    api('GET', '/auth/users').then(u => { state.allUsers = u; render(); });
  }
}

function attachModalHandlers() {
  document.querySelectorAll('#closeModal').forEach(el => {
    el.addEventListener('click', () => { state.modal = null; state.error = null; render(); });
  });
  document.getElementById('modalOverlay')?.addEventListener('click', e => {
    if (e.target === e.currentTarget) { state.modal = null; state.error = null; render(); }
  });

  // Submit new project
  document.getElementById('submitProject')?.addEventListener('click', async () => {
    const name = document.getElementById('mProjName').value.trim();
    const desc = document.getElementById('mProjDesc').value.trim();
    if (!name) return;
    try {
      const project = await api('POST', '/projects', { name, description: desc });
      state.projects.unshift(project);
      state.modal = null;
      toast('Project created!');
      render();
    } catch(e) { toast(e.message, 'error'); }
  });

  // Submit task (create or edit)
  document.getElementById('submitTask')?.addEventListener('click', async () => {
    const taskId = document.getElementById('submitTask').dataset.taskId;
    const body = {
      title: document.getElementById('mTaskTitle').value.trim(),
      description: document.getElementById('mTaskDesc').value.trim(),
      status: document.getElementById('mTaskStatus').value,
      priority: document.getElementById('mTaskPriority').value,
      assignee_id: document.getElementById('mTaskAssignee').value || null,
      due_date: document.getElementById('mTaskDue').value || null
    };
    if (!body.title) return;
    try {
      const pid = state.currentProject.id;
      let task;
      if (taskId) {
        task = await api('PUT', `/projects/${pid}/tasks/${taskId}`, body);
        state.tasks = state.tasks.map(t => t.id == taskId ? task : t);
        toast('Task updated!');
      } else {
        task = await api('POST', `/projects/${pid}/tasks`, body);
        state.tasks.unshift(task);
        toast('Task created!');
      }
      state.modal = null;
      render();
    } catch(e) {
      state.error = e.message;
      render();
    }
  });

  // Submit add member
  document.getElementById('submitMember')?.addEventListener('click', async () => {
    const user_id = document.getElementById('mMemberUser').value;
    const role = document.getElementById('mMemberRole').value;
    if (!user_id) return;
    try {
      await api('POST', `/projects/${state.currentProject.id}/members`, { user_id: Number(user_id), role });
      toast('Member added!');
      state.modal = null;
      navigate('members', { id: state.currentProject.id });
    } catch(e) {
      state.error = e.message;
      render();
    }
  });
}

// ═══════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════
function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtStatus(s) {
  return { todo: 'To Do', in_progress: 'In Progress', done: 'Done' }[s] || s;
}

// ═══════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════
(async function init() {
  if (state.token) {
    try {
      const me = await api('GET', '/auth/me');
      setToken(state.token, me.user);
      await navigate('dashboard');
    } catch {
      logout();
    }
  } else {
    render();
  }
})();
</script>
</body>
</html>
